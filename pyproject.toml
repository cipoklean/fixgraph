[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixgraph"
version = "0.1.0"
description = "Shared, self-improving memory for coding agents — fixes for environment/toolchain failures stored as a graph in HydraDB"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
bench = ["sentence-transformers>=3.0", "matplotlib>=3.8", "numpy>=1.26", "tiktoken>=0.7"]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=8.0"]

[project.scripts]
fixgraph = "fixgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running HydraDB (set FIXGRAPH_URL/FIXGRAPH_TOKEN)",
]
